[project]
name = "roombapy-prime"
authors = [{ name = "Jean-Christoph" }]
version = "0.3.1"
description = "Cloud client for iRobot 'Prime'/V4-generation robots — login, MQTT shadow, region cleaning, maps and schedules, confirmed against real hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "paho-mqtt>=2.0,<3.0",
    "certifi",
]

[project.urls]
Homepage = "https://github.com/johnnyh1975/roombapy-prime"
Repository = "https://github.com/johnnyh1975/roombapy-prime"
Issues = "https://github.com/johnnyh1975/roombapy-prime/issues"
Changelog = "https://github.com/johnnyh1975/roombapy-prime/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
map = [
    "Pillow>=10.0",
]
# Pulls in the separately-distributed diagnostic tooling. Deliberately
# NOT part of the base install: those modules register console scripts,
# several of which MOVE A REAL ROBOT -- they have no business on the
# PATH of every Home Assistant installation that merely consumes this
# library. See tools/pyproject.toml.
tools = [
    # A BARE NAME, not a git URL. PyPI rejects any distribution with a
    # direct-URL dependency ("400 Can't have direct dependency"), and it
    # rejects the whole upload -- so the git pointer that was correct
    # while this was GitHub-only made the package unpublishable.
    #
    # The pin keeps the pair in step: the tools import from this library
    # and the two are released together from one tag.
    "roombapy-prime-tools>=0.3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
roombapy_prime = ["py.typed", "vendor_reference.json"]

[tool.ruff.lint]
# F = pyflakes (undefined names, unused imports)
# B = flake8-bugbear (real Python footguns: mutable default args,
#     closures over loop variables, etc.) -- zero findings when first
#     tried, kept anyway since a clean result costs nothing to keep
#     enabled and guards against future regressions in this category
# C4 = flake8-comprehensions (unnecessary list()/dict() wrapping, etc.)
#      -- also zero findings, same reasoning as B
# UP = pyupgrade (outdated syntax patterns for the supported Python
#      range) -- 58 real findings when first tried (all verified safe
#      and fixed): unnecessary quoted type annotations now that
#      `from __future__ import annotations` is used everywhere,
#      timezone.utc -> datetime.UTC, Callable import path, and
#      (str, Enum) -> StrEnum for all 24 enum classes -- the StrEnum
#      change was checked for actual behavioral difference (str()/
#      f-string formatting differs between the two) before applying,
#      not just accepted on ruff's recommendation alone: no code here
#      relied on str()/f-string formatting of these enums, and
#      json.dumps() output is identical either way.
select = ["F", "B", "C4", "UP"]
