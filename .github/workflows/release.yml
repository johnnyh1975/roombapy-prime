name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Tag to release, e.g. v0.1.11a. If this tag doesn't exist yet,
          it's created at the current commit of whichever branch you
          run this against (normally main) and pushed automatically --
          you do NOT need to create it yourself first. If it already
          exists, this just (re-)runs the release for it as-is (e.g.
          to fix a release-notes typo without cutting a new version).
        required: true

jobs:
  release:
    name: Test, verify, build, and publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing: PyPI verifies this workflow's identity
      # directly, so there is no API token stored in the repository.
      id-token: write
    steps:
      # No explicit `ref:` here on purpose: for a tag push, this
      # already checks out that tag by default. For a manual
      # workflow_dispatch run, this checks out whichever branch was
      # selected in the "Run workflow" dropdown (normally main) -- and
      # THAT commit is what gets tagged below, if the tag doesn't
      # already exist.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve which tag this run is releasing
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      # Only relevant for a manual run: a tag-push trigger means the
      # tag obviously already exists (that's what triggered this run).
      # For workflow_dispatch, create + push it now at the currently
      # checked-out commit, unless it already exists -- in which case
      # this is a re-run for an existing tag (see the input's own
      # description above), and creating it again would fail/move it,
      # so it's deliberately skipped rather than forced.
      - name: Create and push the tag if it doesn't exist yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag '$TAG' already exists -- releasing it as-is, not moving it."
          else
            echo "Tag '$TAG' doesn't exist yet -- creating it at the current commit ($(git rev-parse HEAD))."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + test dependencies
        run: |
          pip install -e ".[test,map]"
          # --no-deps: the tools distribution pins the core by git tag, and
          # that tag does not exist until this very workflow creates it.
          # Without this, pip would fetch a second, unrelated core from
          # GitHub and shadow the editable one being released.
          pip install -e ./tools --no-deps

      - name: Check for stale files from a previous layout
        run: python scripts/check_stale_files.py

      - name: Run test suite (never release on red)
        run: |
          pytest roombapy_prime/tests/ -v
          pytest tools/tests/ -v

      - name: Check README version badge + test count against actual state (never release on stale docs)
        run: python scripts/check_version_badge.py

      - name: Check tools/core version pin (never release a mismatched pair)
        run: python scripts/check_version_pin.py

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (never release on red)
        run: ruff check roombapy_prime tools examples scripts --output-format=github

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel (core)
        run: python -m build

      - name: Build sdist + wheel (tools)
        run: python -m build ./tools --outdir dist-tools

      - name: Verify the core wheel installs cleanly in an isolated venv
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install dist/*.whl
          /tmp/install-check/bin/python -c "import roombapy_prime; print(roombapy_prime.__version__)"

      - name: Verify the core wheel registers NO console scripts
        run: |
          # The whole point of the split: a consumer installing only the
          # library must not get robot-moving commands on their PATH.
          if ls /tmp/install-check/bin/roombapy-prime-* >/dev/null 2>&1; then
            echo "::error::The core wheel installed console scripts -- they belong in tools/ only."
            ls /tmp/install-check/bin/roombapy-prime-*
            exit 1
          fi

      - name: Verify the tools wheel installs and provides its commands
        run: |
          python -m venv /tmp/install-check-tools
          # --no-deps again: the core is installed from the local wheel
          # rather than the not-yet-existing git tag.
          /tmp/install-check-tools/bin/pip install dist/*.whl
          /tmp/install-check-tools/bin/pip install dist-tools/*.whl --no-deps
          /tmp/install-check-tools/bin/roombapy-prime-verify-region-commands --help > /dev/null

      - name: Check for a matching release-notes file
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if [ ! -f "release-notes/$TAG.md" ]; then
            echo "::error::No release-notes/$TAG.md found for this tag."
            echo "::error::Add one (matching the tag name exactly) before releasing."
            exit 1
          fi

      # Every tag on this project so far corresponds to an alpha version
      # (0.x.ya0) -- always marked as a pre-release, never promoted to a
      # full GitHub release automatically. Flip this manually (or adjust
      # this workflow) once/if this project reaches an actual beta/stable
      # milestone -- see docs/PRIME_APP_GAP_ANALYSIS_2026-07-11.md for the
      # concrete criteria discussed for that.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          prerelease: false
          body_path: release-notes/${{ steps.resolve.outputs.tag }}.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist-tools/*.whl
            dist-tools/*.tar.gz

      # ORDER MATTERS. roombapy-prime-tools declares roombapy-prime as a
      # dependency, so the library has to exist on PyPI before the tools
      # package that pins it. Publishing them in one step would race.
      #
      # A version cannot be replaced once uploaded -- only yanked, and
      # the number stays used. Everything above this point (tests,
      # README badge check, install verification in a clean venv) runs
      # first for exactly that reason.
      - name: Publish library to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish tools to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-tools/
