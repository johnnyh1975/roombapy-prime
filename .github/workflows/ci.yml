name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: |
          pip install -e ".[test,map]"
          pip install -e ./tools --no-deps

      - name: Compile check (all modules)
        run: python -m compileall roombapy_prime

      - name: Check for stale files from a previous layout
        run: python scripts/check_stale_files.py

      - name: Run test suite with coverage
        run: |
          pytest roombapy_prime/tests/ -v --cov=roombapy_prime --cov-report=term-missing --cov-report=html
          pytest tools/tests/ -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
        # No threshold enforced (mirrors the reasoning in ha_roomba_plus's
        # own CI pipeline): 91% is this project's own current baseline,
        # arrived at organically, not a target chosen in advance -- a gate
        # here would either be meaninglessly low or an arbitrary number
        # with no real basis. Uploaded per Python version since coverage
        # can differ slightly across versions.

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check roombapy_prime tools examples scripts --output-format=github
        # KEIN continue-on-error mehr (zwoelfte Sitzung): ruff ist seit
        # mehreren Sitzungen durchgehend sauber -- ein echtes Gate ist
        # jetzt aussagekraeftig statt nur informativ.
        # examples/scripts ergaenzt: manuell wurden diese die ganze Zeit
        # mitgeprueft, CI selbst tat das bisher nicht -- Inkonsistenz
        # zwischen tatsaechlicher Verifikationspraxis und dem Gate.

  typing:
    name: Typing (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + typing dependencies
        run: |
          pip install -e ".[test,map]"
          pip install mypy

      # PRODUCTION CODE ONLY, AND NOT --strict. Both are deliberate.
      #
      # The full package under --strict reports 1399 errors; production
      # code alone, at default settings, reports 33. Gating on the
      # larger number would mean gating on nothing, because nobody
      # fixes 1399 errors before the next release -- the job would be
      # switched off within a week.
      #
      # 33 was a number someone could actually work through, and
      # someone did -- it is zero as of 0.3.0b12, which is why the
      # step below is a real gate.
      #
      # Running this at all already paid for itself: the first run
      # found four dataclass fields declared twice in map_bundle.py,
      # where the second declaration silently won and the first block's
      # documentation described a field nobody read. No test can see
      # that.
      # GRADUATED (0.3.0b12): the count reached zero, so this is a real
      # gate now -- no continue-on-error, exactly as the plan above
      # said it would be. What the last 34 turned out to be, since the
      # mix is the argument for having run it at all:
      #
      #   - a genuine crash path: request_mission_timeline() called
      #     self._client.publish() with no None check at all, unlike
      #     the publish next to it. Before connect() that was an
      #     AttributeError on None.
      #   - two missing guards: no irbt_topic_prefix check, so a
      #     request would have gone to "None/things/...".
      #   - annotations that were simply wrong: _watch_topic declared
      #     AsyncIterator while being an async generator (six errors
      #     from one line), three _raise_clear_* helpers declared
      #     -> None while never returning.
      #   - and the rest narrowing noise, fixed by making checks
      #     explicit rather than by casting them away.
      #
      # Next steps, when someone wants them: add tests/, then --strict.
      # The integration next door runs --strict with two error codes
      # named and justified; that is still the destination.
      - name: mypy (production code)
        run: mypy roombapy_prime --exclude 'tests/' --output-format=github

  version-badge:
    name: README version/test-count check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test dependencies
        run: |
          pip install -e ".[test,map]"
          pip install -e ./tools --no-deps

      - name: Check README version badge + test count against actual state
        run: python scripts/check_version_badge.py

      - name: Check tools/core version pin
        run: python scripts/check_version_pin.py

  build:
    name: Build package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel installs cleanly in an isolated venv
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install dist/*.whl
          /tmp/install-check/bin/python -c "import roombapy_prime; print(roombapy_prime.__version__)"
